[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "load_balancer"
version = "0.2.0"
description = "Async load balancer with consistent hashing"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "docker>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
